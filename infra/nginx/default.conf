# Rate limiting : 5 requêtes/seconde par IP pour le webhook SMS
limit_req_zone $binary_remote_addr zone=sms_webhook:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    root /var/www/html/public;
    index index.php index.html;

    # Security headers (relaxed for Filament/Livewire)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Nginx health (for external monitoring)
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # AI service health proxy
    location = /ai/health {
        proxy_pass http://ai-service:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SMS webhook with rate limiting
    location = /api/sms/incoming {
        limit_req zone=sms_webhook burst=10 nodelay;
        try_files /dev/null /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 60s;
    }

    # Block dotfiles (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
